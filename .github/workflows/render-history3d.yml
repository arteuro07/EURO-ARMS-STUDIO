name: Render Desert Eagle cinematic 3D sequence

on:
  workflow_dispatch:
  push:
    paths:
      - "src/remotion/**"
      - "package.json"
      - "remotion.config.js"
      - ".github/workflows/render-history3d.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Render 3D historical sequence
        run: npm run render:history3d
      - name: Verify MP4
        run: |
          test -s dist/desert-eagle-history-3d.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=noprint_wrappers=1 dist/desert-eagle-history-3d.mp4
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: euro-arms-desert-eagle-history-3d
          path: dist/desert-eagle-history-3d.mp4
          if-no-files-found: error
