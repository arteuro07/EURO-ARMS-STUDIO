name: EURO ARMS — rendre la vidéo Desert Eagle

on:
  workflow_run:
    workflows: ["EURO ARMS — générer la narration Desert Eagle"]
    types: [completed]
  workflow_dispatch:
    inputs:
      narration_run_id:
        description: "ID du build de narration contenant EURO-ARMS-EP001-NARRATION"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code du studio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm install

      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Télécharger la narration validée
        uses: actions/download-artifact@v4
        with:
          name: EURO-ARMS-EP001-NARRATION
          path: dist/episode-001
          run-id: ${{ github.event.workflow_run.id || inputs.narration_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer les données de rendu
        run: |
          test -s dist/episode-001/narration-complete.wav
          test -s dist/episode-001/timeline.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("dist/episode-001/timeline.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert len(data["segments"]) == 6, "Il faut exactement six scènes"
          assert data["duration"] > 1
          assert all(s["end"] > s["start"] for s in data["segments"])
          Path("dist/episode-001/remotion-props.json").write_text(
              json.dumps({"timeline": data}, ensure_ascii=False), encoding="utf-8"
          )
          print(f"Timeline validée : {data['duration']:.2f}s / {len(data['segments'])} scènes")
          PY

      - name: Rendre les scènes motion design en 1080x1920
        run: |
          npx remotion render src/remotion/index.jsx DesertEagle \
            dist/episode-001/scene-capture.mp4 \
            --props=dist/episode-001/remotion-props.json \
            --codec=h264 --crf=18 --pixel-format=yuv420p \
            --concurrency=2 --log=error

      - name: Assembler la narration et vérifier le MP4
        run: |
          set -euo pipefail
          DURATION=$(python -c "import json; print(json.load(open('dist/episode-001/timeline.json'))['duration'])")
          ffmpeg -y -i dist/episode-001/scene-capture.mp4 \
            -i dist/episode-001/narration-complete.wav -t "$DURATION" \
            -map 0:v:0 -map 1:a:0 -c:v copy \
            -c:a aac -b:a 192k -shortest -movflags +faststart \
            dist/episode-001/EURO-ARMS-EP001-DESERT-EAGLE.mp4
          test -s dist/episode-001/EURO-ARMS-EP001-DESERT-EAGLE.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 dist/episode-001/EURO-ARMS-EP001-DESERT-EAGLE.mp4 | grep -qx '1080x1920'
          ffprobe -v error -show_entries format=duration -of csv=p=0 dist/episode-001/EURO-ARMS-EP001-DESERT-EAGLE.mp4

      - name: Publier le MP4 motion design
        uses: actions/upload-artifact@v4
        with:
          name: EURO-ARMS-EP001-DESERT-EAGLE-MOTION-DESIGN
          path: |
            dist/episode-001/EURO-ARMS-EP001-DESERT-EAGLE.mp4
            dist/episode-001/ATTRIBUTION.txt
          if-no-files-found: error
          retention-days: 14
